allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
overrides:
  rollup: npm:@rollup/wasm-node
  '@myrmidon/cadmus-refs-lookup': link:./dist/myrmidon/cadmus-refs-lookup
  '@myrmidon/cadmus-refs-citation': link:./dist/myrmidon/cadmus-refs-citation
  '@myrmidon/cadmus-ui-object-view': link:./dist/myrmidon/cadmus-ui-object-view
  '@myrmidon/cadmus-refs-doc-references': link:./dist/myrmidon/cadmus-refs-doc-references
minimumReleaseAgeExclude:
