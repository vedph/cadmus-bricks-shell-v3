<form
  [style.margin]="inDialog ? '16px' : '0'"
  (submit)="onFormSubmit($event)"
>
  <!-- name -->
  <div>
    <mat-form-field>
      <mat-label>name</mat-label>
      <input #nameInput matInput placeholder="name" [formField]="form.name" />
    </mat-form-field>
  </div>
  <!-- list -->
  <table>
    <tbody>
      @for (e of emojis(); track e.code) {
      <tr>
        <td class="name">{{ e.name }}</td>
        <td class="code">{{ e.code | uppercase }}</td>
        <td>
          <button type="button" mat-button (click)="pickEmoji(e)">
            <img
              alt="{{ e.name }}"
              [src]="e.url"
              [width]="size()"
              [height]="size()"
            />
          </button>
        </td>
      </tr>
      }
    </tbody>
  </table>
</form>
