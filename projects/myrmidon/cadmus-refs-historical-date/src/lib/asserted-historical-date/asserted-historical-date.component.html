<div>
  <!-- tag (bound) -->
  @if (tagEntries()?.length) {
    <mat-form-field>
      <mat-label>tag</mat-label>
      <mat-select [formField]="form.tag">
        @for (e of tagEntries(); track e) {
          <mat-option [value]="e.id">{{ e.value }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }
  <!-- tag (free) -->
  @else {
    <mat-form-field>
      <mat-label>tag</mat-label>
      <input matInput [formField]="form.tag" />
      @if (form.tag().getError("max-length") && (form.tag().dirty() || form.tag().touched())) {
        <mat-error>tag too long</mat-error>
      }
    </mat-form-field>
  }
  <div>
    <!-- date -->
    <cadmus-refs-historical-date
      [date]="form.hd().value() || undefined"
      (dateChange)="onDateChange($event)"
    />
    <mat-expansion-panel>
      <!-- assertion -->
      <mat-expansion-panel-header>date assertion</mat-expansion-panel-header>
      <cadmus-refs-assertion
        [assTagEntries]="assertionTagEntries()"
        [refTypeEntries]="docReferenceTypeEntries()"
        [refTagEntries]="docReferenceTagEntries()"
        [assertion]="form.assertion().value() || undefined"
        (assertionChange)="onAssertionChange($event)"
      />
    </mat-expansion-panel>
  </div>
</div>
