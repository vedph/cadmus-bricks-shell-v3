<div class="form-row">
  <!-- provider -->
  @if (configs().length) {
    <mat-form-field>
      <mat-label>provider</mat-label>
      <mat-select
        [value]="config()"
        (selectionChange)="onConfigChange($event.value)"
      >
        @for (c of configs(); track c.name) {
          <mat-option [value]="c">
            <div class="form-row">
              @if (c.iconUrl) {
                <img
                  alt="{{ c.name }}"
                  [src]="c.iconUrl"
                  [width]="iconSize().width"
                  [height]="iconSize().height"
                />
              }
              <span>{{ c.name }}</span>
            </div>
          </mat-option>
        }
      </mat-select>
      <mat-hint>{{ config()?.description }}</mat-hint>
    </mat-form-field>
  }

  <!-- lookup -->
  @if (config(); as config) {
    <cadmus-refs-lookup
      [service]="config.service!"
      [item]="config.item"
      [itemId]="getResolvedItemId(config)"
      [required]="config.required"
      [hasMore]="config.hasMore"
      [optDialog]="config.optDialog"
      [options]="config.options"
      [linkTemplate]="config.linkTemplate"
      [label]="config.label"
      [lookupProviderOptions]="lookupProviderOptions()"
      (itemChange)="onItemChange($event)"
      (moreRequest)="onMoreRequest($event)"
    />
  }
</div>
